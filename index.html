<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>In-Cab Combine Dump Logger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col max-w-md mx-auto">

    <header class="bg-emerald-900 text-white px-4 py-3 flex justify-between items-center shadow-lg sticky top-0 z-50">
        <div class="flex items-center space-x-2">
            <div class="bg-emerald-700 p-2 rounded-lg">
                <i class="fa-solid fa-tractor text-emerald-200"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm">Combine Dump Logger</h1>
                <p id="syncStatus" class="text-[10px] text-emerald-300">Ready</p>
            </div>
        </div>
        <button onclick="syncCacheToCloud()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-1.5 rounded-lg font-bold shadow flex items-center space-x-1">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span id="syncBtnText">Sync (0)</span>
        </button>
    </header>

    <main class="p-4 space-y-4 flex-grow pb-24">
        <!-- Field Selection -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
            <label class="text-xs font-semibold text-emerald-400 flex items-center space-x-1">
                <i class="fa-solid fa-map-location-dot"></i>
                <span>Active Field (Sticky Selection)</span>
            </label>
            <select id="fieldSelect" onchange="handleFieldChange(this.value)" class="w-full bg-slate-950 border border-slate-700 text-sm font-bold rounded-xl p-3 text-white focus:outline-none focus:border-emerald-500"></select>
            <p id="gpsNote" class="text-[10px] text-slate-400 italic">GPS Status: Ready for positioning...</p>
        </div>

        <!-- Timestamp -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
            <label class="text-xs font-semibold text-emerald-400 flex items-center space-x-1">
                <i class="fa-solid fa-clock"></i>
                <span>Dump Timestamp</span>
            </label>
            <div class="flex space-x-2">
                <input type="datetime-local" id="dumpTime" class="w-full bg-slate-950 border border-slate-700 text-xs font-mono rounded-xl p-3 text-white focus:outline-none">
                <button onclick="adjustTime(-15)" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold">-15m</button>
                <button onclick="adjustTime(15)" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-bold">+15m</button>
            </div>
        </div>

        <!-- Grain Tank Level -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3 text-center">
            <label class="block text-xs font-semibold text-emerald-400 text-left flex items-center space-x-1">
                <i class="fa-solid fa-cubes-stacked"></i>
                <span>Grain Tank Level (% Full)</span>
            </label>
            <div class="text-3xl font-black text-emerald-300" id="tankDisplay">100%</div>
            <div class="grid grid-cols-4 gap-2">
                <button onclick="adjustTank(-10)" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold text-rose-400">-10%</button>
                <button onclick="adjustTank(-5)" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold text-rose-300">-5%</button>
                <button onclick="adjustTank(5)" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold text-emerald-300">+5%</button>
                <button onclick="adjustTank(10)" class="bg-slate-800 hover:bg-slate-700 py-2.5 rounded-xl text-xs font-bold text-emerald-400">+10%</button>
            </div>
        </div>

        <!-- Yield Monitor Acres & Moisture with Tenths Control -->
        <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
                <label class="text-xs font-semibold text-emerald-400 block">Yield Acres (Total)</label>
                <input type="number" id="acresInput" value="0.0" step="0.1" class="w-full bg-slate-950 border border-slate-700 text-base font-bold rounded-xl p-2 text-center text-white focus:outline-none">
                <div class="grid grid-cols-4 gap-1 pt-1">
                    <button onclick="adjustAcres(-1.0)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">-1.0</button>
                    <button onclick="adjustAcres(-0.1)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">-0.1</button>
                    <button onclick="adjustAcres(0.1)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">+0.1</button>
                    <button onclick="adjustAcres(1.0)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">+1.0</button>
                </div>
            </div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
                <label class="text-xs font-semibold text-emerald-400 block">Moisture (%)</label>
                <input type="number" id="moistureInput" value="18.5" step="0.1" class="w-full bg-slate-950 border border-slate-700 text-base font-bold rounded-xl p-2 text-center text-white focus:outline-none">
                <div class="grid grid-cols-4 gap-1 pt-1">
                    <button onclick="adjustMoisture(-1.0)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">-1.0</button>
                    <button onclick="adjustMoisture(-0.1)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">-0.1</button>
                    <button onclick="adjustMoisture(0.1)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">+0.1</button>
                    <button onclick="adjustMoisture(1.0)" class="bg-slate-800 hover:bg-slate-700 py-1.5 rounded-lg text-[10px] font-bold">+1.0</button>
                </div>
            </div>
        </div>

        <!-- Notes -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
            <label class="text-xs font-semibold text-emerald-400 block flex items-center space-x-1">
                <i class="fa-solid fa-note-sticky"></i>
                <span>Dump Notes (Optional)</span>
            </label>
            <input type="text" id="notesInput" placeholder="e.g., Long elevator wait" class="w-full bg-slate-950 border border-slate-700 text-xs rounded-xl p-3 text-white focus:outline-none">
        </div>

        <!-- Save Button -->
        <button onclick="saveCombineDump()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 rounded-2xl shadow-xl transition text-base flex items-center justify-center space-x-2">
            <i class="fa-solid fa-floppy-disk text-lg"></i>
            <span>SAVE COMBINE DUMP</span>
        </button>

        <!-- Running Tally -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-2">
            <h2 class="font-bold text-xs text-emerald-400 flex items-center space-x-1">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Today's Running Harvest Tally</span>
            </h2>
            <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-slate-400 block text-[10px]">Total Dumps</span>
                    <span id="tallyDumps" class="text-base font-bold text-white">0</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                    <span class="text-slate-400 block text-[10px]">Total Harvested Delta</span>
                    <span id="tallyAcres" class="text-base font-bold text-white">0.0 ac</span>
                </div>
                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 col-span-2">
                    <span class="text-slate-400 block text-[10px]">Weighted Avg Moisture</span>
                    <span id="tallyMoisture" class="text-base font-bold text-emerald-300">0.0%</span>
                </div>
            </div>
        </div>

        <!-- Logs Table -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl space-y-3">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-xs text-emerald-400 flex items-center space-x-1">
                    <i class="fa-solid fa-list-check"></i>
                    <span>Recent Session Logs</span>
                </h2>
                <button onclick="clearLocalLogs()" class="text-[10px] text-rose-400 hover:underline">Clear Local</button>
            </div>
            <div class="max-h-48 overflow-y-auto rounded-lg border border-slate-800">
                <table class="w-full text-left text-[11px]">
                    <thead class="bg-slate-950 text-slate-400 sticky top-0">
                        <tr>
                            <th class="p-2">Time</th>
                            <th class="p-2">Field</th>
                            <th class="p-2">Tank</th>
                            <th class="p-2">Delta</th>
                            <th class="p-2">MST</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody" class="divide-y divide-slate-800">
                        <tr><td colspan="5" class="p-4 text-center text-slate-500">No dumps recorded yet today.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-3 fixed bottom-0 max-w-md w-full z-40">
        <input type="text" id="syncUrlInput" value="https://script.google.com/macros/s/AKfycbxsbmIXBt3ev_J18mgCOXcBvDIyCx4DPzFEurOKMtb0l8yTAuPdNQLIWf7CP-ayj_Lu/exec" class="w-full bg-slate-950 border border-slate-800 text-[10px] rounded-lg p-2 text-slate-400 font-mono focus:outline-none">
    </footer>

    <script>
        let defaultFields = ["S1", "N1", "N34", "HN", "HS", "NS", "DM", "D2", "R1", "JS", "PB", "A2", "NM", "A4", "A1", "M3", "M2", "M1", "W1", "W2", "SW", "RV"];
        let currentTankPct = 100;
        let cachedDumps = JSON.parse(localStorage.getItem('combine_dumps_cache') || '[]');
        let currentLat = null, currentLon = null;

        window.onload = function() {
            setTimestampNow();
            populateFieldDropdown();
            initSmartInputs();
            updateTallyAndTable();
            detectFieldGPS();
        };

        function setTimestampNow() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('dumpTime').value = now.toISOString().slice(0,16);
        }

        function adjustTime(mins) {
            let input = document.getElementById('dumpTime');
            if (!input.value) return;
            let d = new Date(input.value);
            d.setMinutes(d.getMinutes() + mins);
            input.value = d.toISOString().slice(0,16);
        }

        function adjustTank(amount) {
            currentTankPct = Math.max(5, Math.min(125, currentTankPct + amount));
            document.getElementById('tankDisplay').innerText = currentTankPct + '%';
        }

        function adjustAcres(amt) {
            let input = document.getElementById('acresInput');
            let val = parseFloat(input.value) || 0;
            let newVal = Math.max(0, Math.round((val + amt) * 10) / 10);
            input.value = newVal.toFixed(1);
        }

        function adjustMoisture(amt) {
            let input = document.getElementById('moistureInput');
            let val = parseFloat(input.value) || 18.0;
            let newVal = Math.max(5, Math.min(40, Math.round((val + amt) * 10) / 10));
            input.value = newVal.toFixed(1);
        }

        function initSmartInputs() {
            if (cachedDumps.length > 0) {
                let last = cachedDumps[0];
                if (last.cumulativeAcres !== undefined) {
                    document.getElementById('acresInput').value = Number(last.cumulativeAcres).toFixed(1);
                }
                if (last.moisture !== undefined) {
                    document.getElementById('moistureInput').value = Number(last.moisture).toFixed(1);
                }
            }
        }

        function populateFieldDropdown(selectedCode = null) {
            const select = document.getElementById('fieldSelect');
            select.innerHTML = '';
            let customFields = JSON.parse(localStorage.getItem('custom_farm_fields') || '[]');
            let allFields = [...new Set([...defaultFields, ...customFields])];

            allFields.forEach(code => {
                let opt = document.createElement('option');
                opt.value = code;
                opt.innerText = code;
                select.appendChild(opt);
            });

            let addOpt = document.createElement('option');
            addOpt.value = "ADD_NEW_FIELD";
            addOpt.innerText = "+ Add New Field...";
            select.appendChild(addOpt);

            let lastSelected = selectedCode || localStorage.getItem('sticky_active_field');
            if (lastSelected && allFields.includes(lastSelected)) {
                select.value = lastSelected;
            } else if (allFields.length > 0) {
                select.value = allFields[0];
                localStorage.setItem('sticky_active_field', allFields[0]);
            }
        }

        function handleFieldChange(val) {
            if (val === "ADD_NEW_FIELD") {
                let newCode = prompt("Enter new field code/name:");
                if (newCode && newCode.trim() !== "") {
                    newCode = newCode.trim().toUpperCase();
                    let customFields = JSON.parse(localStorage.getItem('custom_farm_fields') || '[]');
                    if (!defaultFields.includes(newCode) && !customFields.includes(newCode)) {
                        customFields.push(newCode);
                        localStorage.setItem('custom_farm_fields', JSON.stringify(customFields));
                    }
                    populateFieldDropdown(newCode);
                    localStorage.setItem('sticky_active_field', newCode);
                } else {
                    populateFieldDropdown();
                }
            } else {
                localStorage.setItem('sticky_active_field', val);
            }
        }

        function detectFieldGPS() {
            const gpsNote = document.getElementById('gpsNote');
            if (!navigator.geolocation) return;
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    currentLat = pos.coords.latitude;
                    currentLon = pos.coords.longitude;
                    gpsNote.innerText = `GPS Locked: ${currentLat.toFixed(4)}, ${currentLon.toFixed(4)}`;
                },
                (err) => { gpsNote.innerText = "GPS acquisition failed (manual mode active)."; },
                { timeout: 10000, enableHighAccuracy: true }
            );
        }

        function saveCombineDump() {
            let currentCumulativeAcres = parseFloat(parseFloat(document.getElementById('acresInput').value).toFixed(1)) || 0;
            let lastDump = cachedDumps.length > 0 ? cachedDumps[0] : null;
            let previousCumulative = lastDump ? (lastDump.cumulativeAcres || 0) : 0;
            let deltaAcres = currentCumulativeAcres >= previousCumulative ? (currentCumulativeAcres - previousCumulative) : currentCumulativeAcres;

            const record = {
                id: 'DUMP_' + Date.now(),
                timestamp: document.getElementById('dumpTime').value,
                fieldCode: document.getElementById('fieldSelect').value,
                tankPct: currentTankPct,
                cumulativeAcres: currentCumulativeAcres,
                deltaAcres: parseFloat(deltaAcres.toFixed(1)),
                moisture: parseFloat(parseFloat(document.getElementById('moistureInput').value).toFixed(1)) || 0,
                notes: document.getElementById('notesInput').value.trim(),
                lat: currentLat,
                lon: currentLon,
                synced: false
            };

            cachedDumps.unshift(record);
            localStorage.setItem('combine_dumps_cache', JSON.stringify(cachedDumps));

            currentTankPct = 100;
            document.getElementById('tankDisplay').innerText = '100%';
            document.getElementById('notesInput').value = '';
            setTimestampNow();
            updateTallyAndTable();
            alert(`Dump saved successfully! (Delta: ${record.deltaAcres} ac)`);
        }

        function updateTallyAndTable() {
            const tbody = document.getElementById('logTableBody');
            const syncBtnText = document.getElementById('syncBtnText');
            let unsyncedCount = cachedDumps.filter(d => !d.synced).length;
            syncBtnText.innerText = `Sync (${unsyncedCount})`;

            if (cachedDumps.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-500">No dumps recorded yet today.</td></tr>`;
                document.getElementById('tallyDumps').innerText = '0';
                document.getElementById('tallyAcres').innerText = '0.0 ac';
                document.getElementById('tallyMoisture').innerText = '0.0%';
                return;
            }

            let totalDumps = cachedDumps.length;
            let totalDeltaAcres = cachedDumps.reduce((sum, d) => sum + (d.deltaAcres || 0), 0);
            let weightedMoistureSum = cachedDumps.reduce((sum, d) => sum + (d.moisture * (d.deltaAcres || 1)), 0);
            let avgMoisture = totalDeltaAcres > 0 ? (weightedMoistureSum / totalDeltaAcres).toFixed(1) : (cachedDumps[0].moisture || 0).toFixed(1);

            document.getElementById('tallyDumps').innerText = totalDumps;
            document.getElementById('tallyAcres').innerText = totalDeltaAcres.toFixed(1) + ' ac';
            document.getElementById('tallyMoisture').innerText = avgMoisture + '%';

            tbody.innerHTML = '';
            cachedDumps.forEach(d => {
                let tr = document.createElement('tr');
                let timeStr = d.timestamp.split('T')[1] || d.timestamp;
                let syncIcon = d.synced ? '<i class="fa-solid fa-check text-emerald-400 ml-1"></i>' : '<i class="fa-solid fa-clock text-amber-400 ml-1" title="Pending"></i>';
                tr.innerHTML = `
                    <td class="p-2 font-mono">${timeStr}</td>
                    <td class="p-2 font-bold text-emerald-300">${d.fieldCode}</td>
                    <td class="p-2">${d.tankPct}%</td>
                    <td class="p-2">+${Number(d.deltaAcres).toFixed(1)} ac</td>
                    <td class="p-2">${Number(d.moisture).toFixed(1)}% ${syncIcon}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function syncCacheToCloud() {
            let unsynced = cachedDumps.filter(d => !d.synced);
            if (unsynced.length === 0) {
                alert("All local dump records are already synced!");
                return;
            }

            const url = document.getElementById('syncUrlInput').value.trim();
            const payload = {
                type: 'SaveCombineDumps',
                timestamp: new Date().toISOString(),
                dumps: unsynced
            };

            document.getElementById('syncStatus').innerText = "Syncing...";
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                cachedDumps.forEach(d => d.synced = true);
                localStorage.setItem('combine_dumps_cache', JSON.stringify(cachedDumps));
                updateTallyAndTable();
                document.getElementById('syncStatus').innerText = "Sync Complete";
                alert("Successfully synced combine dumps!");
            } catch (err) {
                document.getElementById('syncStatus').innerText = "Sync failed (offline cached)";
                alert("Sync dispatched in background mode.");
            }
        }

        function clearLocalLogs() {
            if (confirm("Clear local dump logs?")) {
                cachedDumps = [];
                localStorage.removeItem('combine_dumps_cache');
                updateTallyAndTable();
            }
        }
    </script>
</body>
</html>
